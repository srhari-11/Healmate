<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cardio & Aerobic</title>

<style>
body {
    font-family: Segoe UI;
    margin: 0;
    background: #eef7ff;
}

/* HEADER */
.header {
    background: linear-gradient(120deg,#4ecdc4,#1a9f9a);
    color: white;
    padding: 20px;
    font-size: 28px;
    text-align: center;
    font-weight: bold;
}

/* PAGE LAYOUT */
.page {
    display: flex;
    max-width: 1100px;
    margin: auto;
    gap: 20px;
    padding: 20px;
}

/* LEFT MENU */
.exercise-list {
    width: 250px;
    background: white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

.exercise-item {
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 8px;
    background: #e6fffb;
    font-weight: 600;
}

.exercise-item:hover {
    background: #c9fff8;
}

/* RIGHT CONTENT */
.content {
    flex: 1;
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

/* VIDEO AREA */
.gif-area {
    text-align: center;
}

.gif-area video {
    width: 300px;
    border-radius: 10px;
}

/* TABS */
.tabs {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

.tabs button {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: #dffefe;
    font-weight: 600;
}

.tabs button.active {
    background: #1a9f9a;
    color: white;
}

/* SECTION */
.section {
    margin-bottom: 20px;
}

.section-title {
    color: #1a9f9a;
    font-weight: bold;
    margin-bottom: 6px;
}

/* TAGS */
.tags {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.tag {
    background: #dffefe;
    padding: 6px 14px;
    border-radius: 20px;
}

/* MUSCLE IMAGE */
.muscle-img {
    margin-top: 10px;
    text-align: center;
}

.muscle-img img {
    width: 180px;
    border-radius: 10px;
}

/* REPS */
.reps {
    display: flex;
    gap: 10px;
    align-items: center;
}

.reps button {
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    background: #dffefe;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">Cardio & Aerobic</div>

<div class="page">

<!-- LEFT MENU -->
<div class="exercise-list">
    <div class="exercise-item" onclick="loadExercise('jumpingjacks')">Jumping Jacks</div>
    
    <div class="exercise-item" onclick="loadExercise('burpees')">Burpees</div>
</div>

<!-- RIGHT CONTENT -->
<div class="content">
    <h2 id="exerciseTitle">Jumping Jacks</h2>

    <div class="gif-area">
        <video id="exerciseVideo" controls autoplay loop muted></video>
    </div>

    <div class="tabs">
        <button id="animationBtn" class="active" onclick="showAnimation()">Animation</button>
        <button id="muscleBtn" onclick="showMuscle()">Muscle</button>
        <button onclick="openVideo()">How to do</button>
    </div>

    <div class="section">
        <div class="section-title">REPS</div>
        <div class="reps">
            <button onclick="minus()">-</button>
            <span id="reps">20</span>
            <button onclick="plus()">+</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">INSTRUCTIONS</div>
        <p id="instructions"></p>
    </div>

    <div class="section">
        <div class="section-title">FOCUS AREA</div>
        <div class="tags" id="focusArea"></div>

        <!-- Muscle image below focus area -->
        <div class="muscle-img">
            <img id="muscleImg" src="">
        </div>
    </div>

    <div class="section">
        <div class="section-title">COMMON MISTAKES</div>
        <p id="mistakes"></p>
    </div>

    <div class="section">
        <div class="section-title">BREATHING TIPS</div>
        <p id="breathing"></p>
    </div>

</div>
</div>

<script>
const exercises = {
    jumpingjacks: {
        title: "Jumping Jacks",
        videoFile: "j1.mp4",
        muscleVideo: "j2.mp4",
        focusImage: "j3.jpeg",
        video: "https://www.youtube.com/watch?v=c4DAnQ6DtF8",
        instructions: "Jump while raising your arms and spreading legs simultaneously.",
        focus: ["Full Body", "Legs", "Cardio"],
        mistakes: "Landing hard on heels.",
        breathing: "Breathe rhythmically with jumps."
    },
    
    burpees: {
        title: "Burpees",
        videoFile: "bb1.mp4",
        muscleVideo: "bb2.mp4",
        focusImage: "bb3.jpeg",
        video: "https://www.youtube.com/watch?v=TU8QYVW0gDU",
        instructions: "Squat, kick back, push-up, jump up sequence.",
        focus: ["Full Body", "Cardio", "Arms"],
        mistakes: "Skipping push-up or jump.",
        breathing: "Exhale on push-up, inhale on squat."
    }
};

let currentExercise = "jumpingjacks";
let reps = 20;
let videoElem = document.getElementById("exerciseVideo");
let animationBtn = document.getElementById("animationBtn");
let muscleBtn = document.getElementById("muscleBtn");

function loadExercise(name){
    currentExercise = name;
    let ex = exercises[name];

    document.getElementById("exerciseTitle").innerText = ex.title;
    document.getElementById("instructions").innerText = ex.instructions;
    document.getElementById("mistakes").innerText = ex.mistakes;
    document.getElementById("breathing").innerText = ex.breathing;

    // Focus area tags
    let focusHTML = "";
    ex.focus.forEach(f => { focusHTML += `<div class="tag">${f}</div>` });
    document.getElementById("focusArea").innerHTML = focusHTML;

    // Show unique focus image
    document.getElementById("muscleImg").src = ex.focusImage;
    document.getElementById("muscleImg").style.display = "block";

    showAnimation();
    setActiveTab('animation');
}

function showAnimation(){
    let ex = exercises[currentExercise];
    videoElem.src = ex.videoFile;
    videoElem.style.display = "block";
    setActiveTab('animation');
}

function showMuscle(){
    let ex = exercises[currentExercise];
    if(ex.muscleVideo){ videoElem.src = ex.muscleVideo; videoElem.style.display = "block"; }
    document.getElementById("muscleImg").style.display = "block";
    setActiveTab('muscle');
}

function openVideo(){ window.open(exercises[currentExercise].video,"_blank"); }
function plus(){ reps++; document.getElementById("reps").innerText = reps; }
function minus(){ if(reps>1){reps--} document.getElementById("reps").innerText = reps; }
function setActiveTab(tab){ if(tab==='animation'){ animationBtn.classList.add('active'); muscleBtn.classList.remove('active'); } 
else{ muscleBtn.classList.add('active'); animationBtn.classList.remove('active'); } }

loadExercise("jumpingjacks");
</script>

</body>
</html>
