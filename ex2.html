<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Strength & Resistance Training</title>

<style>
body {
    font-family: Segoe UI;
    margin: 0;
    background: #eef7ff;
}

/* HEADER */
.header {
    background: linear-gradient(120deg,#4ecdc4,#1a9f9a);
    color: white;
    padding: 20px;
    font-size: 28px;
    text-align: center;
    font-weight: bold;
}

/* PAGE LAYOUT */
.page {
    display: flex;
    max-width: 1100px;
    margin: auto;
    gap: 20px;
    padding: 20px;
}

/* LEFT MENU */
.exercise-list {
    width: 250px;
    background: white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

.exercise-item {
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 8px;
    background: #e6fffb;
    font-weight: 600;
}

.exercise-item:hover {
    background: #c9fff8;
}

/* RIGHT CONTENT */
.content {
    flex: 1;
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

/* VIDEO AREA */
.gif-area {
    text-align: center;
}

.gif-area video {
    width: 300px;
    border-radius: 10px;
}

/* TABS */
.tabs {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

.tabs button {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: #dffefe;
    font-weight: 600;
}

.tabs button.active {
    background: #1a9f9a;
    color: white;
}

/* SECTION */
.section {
    margin-bottom: 20px;
}

.section-title {
    color: #1a9f9a;
    font-weight: bold;
    margin-bottom: 6px;
}

/* TAGS */
.tags {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.tag {
    background: #dffefe;
    padding: 6px 14px;
    border-radius: 20px;
}

/* MUSCLE IMAGE */
.muscle-img {
    margin-top: 10px;
    text-align: center;
}

.muscle-img img {
    width: 180px;
    border-radius: 10px;
}

/* REPS */
.reps {
    display: flex;
    gap: 10px;
    align-items: center;
}

.reps button {
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    background: #dffefe;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">Strength & Resistance Training</div>

<div class="page">

<!-- LEFT MENU -->
<div class="exercise-list">
    <div class="exercise-item" onclick="loadExercise('pushups')">Push Ups</div>
    <div class="exercise-item" onclick="loadExercise('squats')">Bodyweight Squats</div>
    <div class="exercise-item" onclick="loadExercise('lunges')">Lunges</div>
</div>

<!-- RIGHT CONTENT -->
<div class="content">
    <h2 id="exerciseTitle">Push Ups</h2>

    <div class="gif-area">
        <video id="exerciseVideo" controls autoplay loop muted></video>
    </div>

    <div class="tabs">
        <button id="animationBtn" class="active" onclick="showAnimation()">Animation</button>
        <button id="muscleBtn" onclick="showMuscle()">Muscle</button>
        <button onclick="openVideo()">How to do</button>
    </div>

    <div class="section">
        <div class="section-title">REPS</div>
        <div class="reps">
            <button onclick="minus()">-</button>
            <span id="reps">30</span>
            <button onclick="plus()">+</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">INSTRUCTIONS</div>
        <p id="instructions"></p>
    </div>

    <div class="section">
        <div class="section-title">FOCUS AREA</div>
        <div class="tags" id="focusArea"></div>

        <!-- Muscle image below focus area -->
        <div class="muscle-img">
            <img id="muscleImg" src="">
        </div>
    </div>

    <div class="section">
        <div class="section-title">COMMON MISTAKES</div>
        <p id="mistakes"></p>
    </div>

    <div class="section">
        <div class="section-title">BREATHING TIPS</div>
        <p id="breathing"></p>
    </div>

</div>
</div>

<script>
const exercises = {
    pushups: {
        title: "Push Ups",
        videoFile: "p1.mp4",
        muscleVideo: "p2.mp4",
        focusImage: "p3.jpeg",  // unique focus image
        video: "https://www.youtube.com/watch?v=_l3ySVKYVJ8",
        instructions: "Lower your body while keeping your back straight and push upward.",
        focus: ["Chest", "Triceps", "Shoulders"],
        mistakes: "Sagging hips, incomplete range.",
        breathing: "Inhale down, exhale push."
    },
    squats: {
        title: "Bodyweight Squats",
        videoFile: "ss1.mp4",
        muscleVideo: "ss2.mp4",
        focusImage: "ss3.jpeg",  // unique focus image
        video: "https://www.youtube.com/watch?v=aclHkVaku9U",
        instructions: "Lower hips like sitting on a chair then stand back up.",
        focus: ["Quadriceps", "Glutes", "Hamstrings"],
        mistakes: "Knees collapsing inward.",
        breathing: "Inhale down, exhale up."
    },
   
   lunges: {
    title: "Lunges",
    videoFile: "lunges1.mp4",   // actual video
    muscleVideo: "lunges.mp4", // video for muscle tab
    focusImage: "L3.jpeg",     // static image for focus/muscle preview
    video: "https://www.youtube.com/watch?v=pSHjTRCQxIw",
    instructions: "Stand with your feet shoulder width apart, hands on hips, step forward and lower body until thigh is parallel. Return and switch leg.",
    focus: ["Quadriceps", "Glutes", "Hamstrings"],
    mistakes: "Leaning forward too much.",
    breathing: "Inhale down, exhale up."
   },
}
let currentExercise = "pushups";
let reps = 30;
let videoElem = document.getElementById("exerciseVideo");
let animationBtn = document.getElementById("animationBtn");
let muscleBtn = document.getElementById("muscleBtn");

function loadExercise(name){
    currentExercise = name;
    let ex = exercises[name];

    document.getElementById("exerciseTitle").innerText = ex.title;
    document.getElementById("instructions").innerText = ex.instructions;
    document.getElementById("mistakes").innerText = ex.mistakes;
    document.getElementById("breathing").innerText = ex.breathing;

    // Focus area tags
    let focusHTML = "";
    ex.focus.forEach(f => { focusHTML += `<div class="tag">${f}</div>` });
    document.getElementById("focusArea").innerHTML = focusHTML;

    // Show unique focus image
    document.getElementById("muscleImg").src = ex.focusImage;
    document.getElementById("muscleImg").style.display = "block";

    // Play main video by default
    showAnimation();
    setActiveTab('animation');
}

function showAnimation(){
    let ex = exercises[currentExercise];
    videoElem.src = ex.videoFile;
    videoElem.style.display = "block";
    setActiveTab('animation');
}

function showMuscle(){
    let ex = exercises[currentExercise];
    if(ex.muscleVideo){
        videoElem.src = ex.muscleVideo;
        videoElem.style.display = "block";
    }
    document.getElementById("muscleImg").style.display = "block";
    setActiveTab('muscle');
}

function openVideo(){
    window.open(exercises[currentExercise].video,"_blank");
}

// Reps functions
function plus(){ reps++; document.getElementById("reps").innerText = reps; }
function minus(){ if(reps > 1){ reps-- } document.getElementById("reps").innerText = reps; }

function setActiveTab(tab){
    if(tab === 'animation'){
        animationBtn.classList.add('active');
        muscleBtn.classList.remove('active');
    } else {
        muscleBtn.classList.add('active');
        animationBtn.classList.remove('active');
    }
}

// Load default exercise
loadExercise("pushups");
</script>

</body>
</html>
