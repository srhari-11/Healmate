<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Micro Exercise</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: #eef7ff;
}
.header {
    background: linear-gradient(120deg,#4ecdc4,#1a9f9a);
    color: white;
    padding: 20px;
    font-size: 28px;
    text-align: center;
    font-weight: bold;
}
.page {
    display: flex;
    max-width: 1100px;
    margin: auto;
    gap: 20px;
    padding: 20px;
}
.exercise-list {
    width: 250px;
    background: white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}
.exercise-item {
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 8px;
    background: #e6fffb;
    font-weight: 600;
}
.exercise-item:hover { background: #c9fff8; }
.content {
    flex: 1;
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}
.gif-area { text-align: center; }
.gif-area video { width: 300px; border-radius: 10px; }
.tabs { display: flex; gap: 10px; margin: 20px 0; }
.tabs button {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: #dffefe;
    font-weight: 600;
}
.tabs button.active { background: #1a9f9a; color: white; }
.section { margin-bottom: 20px; }
.section-title { color: #1a9f9a; font-weight: bold; margin-bottom: 6px; }
.tags { display: flex; gap: 10px; flex-wrap: wrap; }
.tag { background: #dffefe; padding: 6px 14px; border-radius: 20px; }
.muscle-img { margin-top: 10px; text-align: center; }
.muscle-img img { width: 180px; border-radius: 10px; }
.reps { display: flex; gap: 10px; align-items: center; }
.reps button {
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    background: #dffefe;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">Micro Exercises</div>

<div class="page">
    <div class="exercise-list">
        <div class="exercise-item" onclick="loadExercise('armraise')">Arm raise</div>
        <div class="exercise-item" onclick="loadExercise('armcircle')">Arm circle</div>
    </div>

    <div class="content">
        <h2 id="exerciseTitle">Arm raise</h2>

        <div class="gif-area">
            <video id="exerciseVideo" controls autoplay loop muted></video>
        </div>

        <div class="tabs">
            <button id="animationBtn" class="active" onclick="showAnimation()">Animation</button>
            <button id="muscleBtn" onclick="showMuscle()">Muscle</button>
            <button onclick="openVideo()">How to do</button>
        </div>

        <div class="section">
            <div class="section-title">REPS / TIME</div>
            <div class="reps">
                <button onclick="minus()">-</button>
                <span id="reps">15</span>
                <button onclick="plus()">+</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">INSTRUCTIONS</div>
            <p id="instructions"></p>
        </div>

        <div class="section">
            <div class="section-title">FOCUS AREA</div>
            <div class="tags" id="focusArea"></div>

            <div class="muscle-img">
                <img id="muscleImg" src="">
            </div>
        </div>

        <div class="section">
            <div class="section-title">COMMON MISTAKES</div>
            <p id="mistakes"></p>
        </div>

        <div class="section">
            <div class="section-title">BREATHING TIPS</div>
            <p id="breathing"></p>
        </div>
    </div>
</div>

<script>
const exercises = {
    armraise: {
        title: "Arm raise",
        videoFile: "a1.mp4",
        muscleVideo: "a2.mp4",
        focusImage: "a3.jpeg",
        instructions: "Stand straight, lift both arms slowly from your sides to above your head.",
        focus: ["Shoulders", "Biceps"],
        mistakes: "Bending elbows, arching the lower back, lifting shoulders too high.",
        breathing: "Inhale while raising arms, exhale while lowering them."
    },
    armcircle: {
        title: "Arm circle",
        videoFile: "ac1.mp4",
        muscleVideo: null, // No Muscle tab
        focusImage: "ac2.jpeg",
        instructions: "Extend arms straight to the sides and make small controlled circles.",
        focus: ["Shoulders", "Biceps"],
        mistakes: "Moving too fast, bending elbows, swinging the body.",
        breathing: "Breathe normally and steadily during the movement."
    }
};

let currentExercise = "armraise";
let reps = 15;
let videoElem = document.getElementById("exerciseVideo");
let animationBtn = document.getElementById("animationBtn");
let muscleBtn = document.getElementById("muscleBtn");

function loadExercise(name){
    currentExercise = name;
    let ex = exercises[name];
    
    document.getElementById("exerciseTitle").innerText = ex.title;
    document.getElementById("instructions").innerText = ex.instructions;
    document.getElementById("mistakes").innerText = ex.mistakes;
    document.getElementById("breathing").innerText = ex.breathing;

    let focusHTML = "";
    ex.focus.forEach(f => { focusHTML += `<div class="tag">${f}</div>`; });
    document.getElementById("focusArea").innerHTML = focusHTML;

    document.getElementById("muscleImg").src = ex.focusImage;
    document.getElementById("muscleImg").style.display = "block";

    // Show/hide Muscle tab
    if(!ex.muscleVideo){
        muscleBtn.style.display = "none"; // hide Muscle tab
    } else {
        muscleBtn.style.display = "inline-block"; // show Muscle tab
    }

    showAnimation();
    setActiveTab('animation');

    reps = 15;
    document.getElementById("reps").innerText = reps;
}

function showAnimation(){ 
    let ex = exercises[currentExercise]; 
    videoElem.src = ex.videoFile; 
    videoElem.style.display="block"; 
    setActiveTab('animation'); 
}

function showMuscle(){ 
    let ex = exercises[currentExercise]; 

    if(ex.muscleVideo){
        videoElem.src = ex.muscleVideo; 
        videoElem.style.display="block"; 
    }

    document.getElementById("muscleImg").style.display="block"; 
    setActiveTab('muscle'); 
}

function openVideo(){ 
    window.open(exercises[currentExercise].videoFile, "_blank"); 
}

function plus(){ 
    reps++; 
    document.getElementById("reps").innerText = reps; 
}

function minus(){ 
    if(reps>1) reps--; 
    document.getElementById("reps").innerText = reps; 
}

function setActiveTab(tab){ 
    if(tab==='animation'){
        animationBtn.classList.add('active'); 
        muscleBtn.classList.remove('active');
    } else{ 
        muscleBtn.classList.add('active'); 
        animationBtn.classList.remove('active');
    } 
}

// Load default exercise
loadExercise("armraise");
</script>

</body>
</html>
