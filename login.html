<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:rgb(223,240,250);
font-family:Arial;
}

.form-box{
width:350px;
padding:30px;
background:white;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2{text-align:center;margin-bottom:10px;}
.subtitle{text-align:center;font-size:14px;color:gray;margin-bottom:20px;}

form{display:flex;flex-direction:column;}

input{
padding:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{background:#1e40af;}

p{text-align:center;margin-top:15px;font-size:14px;}
a{color:#2563eb;text-decoration:none;}
</style>
</head>

<body>

<div class="form-box">
<h2>Login</h2>
<p class="subtitle">Login using your registered email</p>

<form id="loginForm">
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<p>Don't have account? <a href="signup.html">Sign Up</a></p>
</div>

<script>

const supabaseUrl = "https://aesjzhjfnkmxdvivjaqy.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlc2p6aGpmbmtteGR2aXZqYXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0MTU5MzUsImV4cCI6MjA4Njk5MTkzNX0.ttXhdM1XU_VVQPDdtDEumawzgXqlo-JQtbT1WUO7G1E";

const { createClient } = supabase;
const supabaseClient = createClient(supabaseUrl, supabaseKey);

document.getElementById("loginForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const { error } = await supabaseClient.auth.signInWithPassword({
email: email,
password: password
});

if(error){
alert(error.message);
}else{
alert("Login Successful!");
window.location.href="home.html";
}
});

</script>

</body>
</html>
